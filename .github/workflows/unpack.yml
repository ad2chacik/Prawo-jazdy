name: Unpack site payload

on:
  push:
    paths:
      - payload.005
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode package
        shell: bash
        run: |
          cat payload.001 payload.002 payload.003 payload.004 payload.005 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/prawo-jazdy.zip
          rm -rf /tmp/prawo-jazdy-site
          mkdir -p /tmp/prawo-jazdy-site
          unzip -q -o /tmp/prawo-jazdy.zip -d /tmp/prawo-jazdy-site
          cp -a /tmp/prawo-jazdy-site/. .

      - name: Commit application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html styles.css app.js sw.js manifest.webmanifest icon.svg .nojekyll
          if git diff --cached --quiet; then
            echo "No application changes."
            exit 0
          fi
          git commit -m "Deploy Prawo Jazdy PWA"
          git push
